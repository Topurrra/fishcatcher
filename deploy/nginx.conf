server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # Branded 404 instead of the stock nginx page. The internal redirect to
    # /404.html does not re-enter the rules below, which match $request_uri
    # (the original client request), not the rewritten $uri.
    error_page 404 /404.html;

    # ---- Canonical URLs: 301 .html to the clean form, /index.html to / ----
    # Absolute https targets: nginx listens on plain 8080 behind the tunnel, so
    # $scheme is "http" here and a relative redirect would downgrade the client.
    if ($request_uri ~ "^/index\.html($|\?)") { return 301 https://fishcatcher.dev/; }
    if ($request_uri ~ "^/(.*)\.html($|\?)")  { return 301 https://fishcatcher.dev/$1; }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/xml;
    gzip_min_length 512;

    # /404 is the error page, not a real page: answer a direct hit with a real
    # 404 instead of a soft 200. (/404.html is 301'd to /404 by the rule above.)
    location = /404 { return 404; }

    # ---- HTML and everything else: clean URLs + full security headers ----
    # Serve /docs as docs.html, /learn as learn.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Security headers. A security tool should pass its own scan; these get an
        # A on securityheaders.com / Mozilla Observatory. Repeated in each location
        # because nginx add_header does not merge across contexts.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache" always;
        add_header Link "</sitemap.xml>; rel=\"sitemap\"" always;
    }

    # ---- CSS/JS: always revalidate. They change with the pages; a week-stale
    # stylesheet under fresh HTML is how the FAQ once rendered unstyled. ----
    location ~* .(?:css|js|mjs)$ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Fonts and images: long cache + the same security headers ----
    location ~* \.(?:css|js|mjs|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
