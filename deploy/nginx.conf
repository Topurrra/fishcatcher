server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Canonical URLs: 301 .html to the clean form, /index.html to / ----
    # Matches on the original client request only, so the internal try_files
    # rewrite to docs.html does not loop.
    if ($request_uri ~ "^/index\.html($|\?)") { return 301 /; }
    if ($request_uri ~ "^/(.*)\.html($|\?)")  { return 301 /$1; }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/xml;
    gzip_min_length 512;

    # ---- HTML and everything else: clean URLs + full security headers ----
    # Serve /docs as docs.html, /learn as learn.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Security headers. A security tool should pass its own scan; these get an
        # A on securityheaders.com / Mozilla Observatory. Repeated in each location
        # because nginx add_header does not merge across contexts.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Static assets: long cache + the same security headers ----
    location ~* \.(?:css|js|mjs|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
