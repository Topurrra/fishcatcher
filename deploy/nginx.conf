server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Serve /docs as docs.html, /learn as learn.html, etc. Falls back to a real
    # file, then the .html variant, then a directory, else 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long cache for fingerprinted-ish static assets; HTML stays fresh.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # Small hardening: no framing, no MIME sniffing.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
