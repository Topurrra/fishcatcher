name: Update phishing feed

# Rebuilds fishcatcher-lists.json daily from the community feed and commits it
# only when it changed. No secrets needed: the built-in GITHUB_TOKEN can push
# because permissions.contents is set to write.

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC. For weekly, use '17 5 * * 1' (Mondays).
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fishcatcher-lists.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh phishing feed ($(date -u +%F))"
            git push
          fi
