<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 class="wm"><a class="wm-link" href="https://fishcatcher.dev" target="_blank" rel="noopener" title="Open fishcatcher.dev"><span class="wm-swap"><span class="wm-fish">Fish</span><span class="wm-phish" data-text="Phish">Phish</span></span> Catcher</a></h1>
  </header>

  <div id="status" class="status">
    <canvas id="fc-fish" class="status-fish" aria-hidden="true"></canvas>
    <div class="status-body">
      <span class="label" id="status-label"></span>
      <span id="domain" class="status-domain" hidden></span>
    </div>
  </div>

  <section id="reasons-wrap" hidden>
    <h2 class="section-label" data-i18n="reasonsTitle">Why am I seeing this?</h2>
    <ul id="reasons"></ul>
  </section>

  <div class="actions">
    <button id="trust-btn" hidden></button>
    <button id="recheck-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg>
      <span data-i18n="recheckButton">Check again</span>
    </button>
    <button id="open-options-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
      <span data-i18n="optionsHeading">Settings</span>
    </button>
  </div>

  <div id="action-note" class="statusline is-ready" hidden><span class="si-icon"></span><span class="si-text"></span></div>

  <script type="module" src="popup.js"></script>
  <script src="../ui/fish.js"></script>
</body>
</html>
